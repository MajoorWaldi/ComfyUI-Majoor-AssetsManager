name: frontend-compat-nightly

on:
    schedule:
        - cron: "17 3 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    comfyui-frontend-latest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout extension
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Checkout ComfyUI frontend latest
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: Comfy-Org/ComfyUI_frontend
                  ref: main
                  path: _upstream/ComfyUI_frontend

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "25"
                  cache: npm

            - name: Install extension dependencies
              run: npm ci --ignore-scripts

            - name: Build types from latest ComfyUI frontend source
              working-directory: _upstream/ComfyUI_frontend
              run: |
                  corepack enable
                  pnpm install --frozen-lockfile
                  pnpm build:types

            - name: Activate latest generated ComfyUI frontend types
              shell: bash
              run: |
                  set -euo pipefail
                  root="_upstream/ComfyUI_frontend"
                  pkg_dir="node_modules/@comfyorg/comfyui-frontend-types"
                  entry=""
                  # Relative to "$root/dist", since we copy that whole directory below
                  # (some entrypoints are a single bundled declaration file; others -
                  # when upstream's declaration bundling step is skipped - are a plain
                  # per-file tsc emission mirroring src/, which only works if its
                  # sibling files are copied alongside it so relative imports resolve).
                  for candidate in "index.d.ts" "types/index.d.ts" "src/types/index.d.ts"; do
                      if [ -f "$root/dist/$candidate" ]; then
                          entry="$candidate"
                          break
                      fi
                  done
                  if [ -z "$entry" ]; then
                      echo "::error::Generated type entrypoint not found under $root/dist."
                      echo "This usually means upstream's 'pnpm build:types' failed to emit a" \
                           "declaration bundle (e.g. a type error on their main branch) rather" \
                           "than this extension being incompatible - check the 'Build types from" \
                           "latest ComfyUI frontend source' step's output above."
                      echo "Contents of $root/dist (if it exists):"
                      find "$root/dist" -maxdepth 3 -type f 2>/dev/null | sort || echo "  (dist/ does not exist)"
                      exit 1
                  fi
                  echo "Using generated types from: $root/dist/$entry"
                  # Copy the whole generated dist/ tree (not just the entry file) so
                  # that an unbundled, per-file declaration emission keeps its
                  # relative imports resolvable, then re-export the real entry - and
                  # global.d.ts's ambient augmentations, if present - from the
                  # package's index.d.ts.
                  rm -rf "$pkg_dir/_generated"
                  cp -r "$root/dist" "$pkg_dir/_generated"
                  {
                      if [ -f "$pkg_dir/_generated/global.d.ts" ]; then
                          echo '/// <reference path="./_generated/global.d.ts" />'
                      fi
                      echo "export * from \"./_generated/${entry%.d.ts}.js\";"
                  } > "$pkg_dir/index.d.ts"

            - name: Typecheck against latest official ComfyUI frontend types
              run: npx tsc -p tsconfig.json --noEmit --pretty false

            - name: Run ComfyUI integration contract tests
              run: >-
                  npx vitest run
                  ui/tests/comfy_api_bridge.vitest.ts
                  ui/tests/host_adapter_contract.vitest.ts
                  ui/tests/graph_traversal.vitest.ts
                  ui/tests/majoor_save_placeholders.vitest.ts

            - name: Build extension bundle
              run: npm run build

            - name: Verify node documentation is bundled
              shell: bash
              run: |
                  test -f dist/docs/MajoorSaveImage.md
                  test -f dist/docs/MajoorSaveVideo.md
                  test -f dist/docs/MajoorGenInfoOverride.md

            - name: Check nightly frontend integration surfaces
              shell: bash
              run: |
                  set -euo pipefail
                  root="_upstream/ComfyUI_frontend"
                  test -f "$root/src/types/extensionTypes.ts"
                  test -f "$root/src/stores/workspaceStore.ts"
                  grep -R "sidebarTabStore" "$root/src/stores" >/dev/null
                  grep -R "dialog" "$root/src/services" "$root/src/stores" >/dev/null
                  grep -R "registerSidebarTab" "$root/src" >/dev/null
                  git -C "$root" rev-parse HEAD
