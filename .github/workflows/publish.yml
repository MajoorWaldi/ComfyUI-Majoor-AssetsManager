# This workflow builds the frontend, packs the node, publishes it to the Comfy
# registry, and mirrors that version as a GitHub Release. Same shape as
# ComfyUI-Majoor-OmniCam's publish_action.yml, without the OmniCam-only
# adapter-contract and registry-status-polling steps this repo has no use for.
name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

permissions:
  contents: write
  issues: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        run: python -m pytest -q
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck frontend
        run: npx tsc -p tsconfig.json --noEmit --pretty false
      - name: Build frontend bundle
        run: npm run build
      - name: Fail if committed dist/ is stale
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::Committed dist/ differs from a fresh build. Run 'npm run build' and commit the result before releasing."
            git diff --stat -- dist
            exit 1
          fi

  release-build:
    name: Build release artifacts
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.repository_owner == 'MajoorWaldi' }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      asset: ${{ steps.release.outputs.asset }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Build the frontend bundle
        run: npm ci --ignore-scripts && npm run build
      - name: Install Comfy CLI
        run: pip install comfy-cli
      - name: Pack Registry archive
        # comfy-cli honors .comfyignore, which already lists the dev-only
        # files this repo keeps out of the shipped node.
        run: |
          comfy --skip-prompt --no-enable-telemetry node pack
          test -f node.zip
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION="$(python -c 'from pathlib import Path; lines=Path("pyproject.toml").read_text(encoding="utf-8").splitlines(); print(next(line.split("=", 1)[1].strip().strip("\"") for line in lines if line.startswith("version = ")))')"

          TAG="v${VERSION}"
          ASSET="majoor-assetsmanager-${VERSION}.zip"

          cp node.zip "${ASSET}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: majoor-assetsmanager-${{ steps.release.outputs.version }}
          path: ${{ steps.release.outputs.asset }}
          retention-days: 90
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refreshing archive."
            gh release upload "${TAG}" "${ASSET}" --clobber
          else
            gh release create "${TAG}" "${ASSET}" \
              --target "${GITHUB_SHA}" \
              --title "Majoor Assets Manager ${TAG}" \
              --generate-notes \
              --draft
          fi

  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: read
    if: ${{ github.repository_owner == 'MajoorWaldi' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main; fixes comfy-cli --yes removal
        with:
          ## Add your own personal access token to your Github Repository secrets and reference it here.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

  release-github:
    name: Finalize GitHub Release
    needs: [release-build, publish-node]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.repository_owner == 'MajoorWaldi' }}
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-build.outputs.tag }}
        run: gh release edit "${TAG}" --draft=false --latest
